<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pokémon Rojo</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      background-image: url('portada.jpg');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: contain;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    /* Fuerza visibilidad en cualquier botón o contenedor de inicio de EmulatorJS */
    #game button,
    #game [class*="start"] {
      background-color: #dc2626 !important;
      color: #ffffff !important;
      opacity: 1 !important;
      visibility: visible !important;
      border: 2px solid #ffffff !important;
      border-radius: 8px !important;
      padding: 12px 24px !important;
      font-weight: bold !important;
      cursor: pointer !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.9) !important;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script>
    EJS_player = '#game';
    EJS_core = 'gb';
    EJS_gameUrl = 'Pkmn_Red.zip';
    EJS_backgroundImage = new URL('portada.jpg', window.location.href).href;
    EJS_backgroundBlur = false;
    EJS_color = '#dc2626';
    EJS_startOnLoaded = false;
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
