<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pokémon Rojo</title>
  <style>
    html, body { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      background: #000 url('portada.jpg') no-repeat center center;
      background-size: contain;
      overflow: hidden; 
    }
    #game { 
      width: 100%; 
      height: 100%; 
    }
    .ejs_start_button_container, .ejs_menu_bar, #game > div {
      background-color: rgba(0, 0, 0, 0.25) !important;
    }
  </style>
</head>
<body>
  <div style="width:100%;height:100%;">
    <div id="game"></div>
  </div>

  <script>
    EJS_player = '#game';
    EJS_core = 'gb';
    EJS_gameUrl = 'Pkmn_Red.zip';
    EJS_backgroundImage = new URL('portada.jpg', window.location.href).href;
    EJS_backgroundBlur = false;
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
